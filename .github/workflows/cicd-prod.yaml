name: CI/CD - PROD Environment

on:
  push:
    branches:
      - PROD
  pull_request:
    branches:
      - PROD

env:
  DOCKER_USERNAME: sharefdnskube
  DOCKER_REPO: sharefdnskube/tejara

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_SECRET }}
      
      - name: Generate timestamp
        id: timestamp
        run: echo "timestamp=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}:prod-latest
            ${{ env.DOCKER_REPO }}:prod-${{ steps.timestamp.outputs.timestamp }}
          cache-from: type=registry,ref=${{ env.DOCKER_REPO }}:buildcache-prod
          cache-to: type=registry,ref=${{ env.DOCKER_REPO }}:buildcache-prod,mode=max
      
      - name: Image digest
        run: echo "Production image pushed successfully with tags prod-latest and prod-${{ steps.timestamp.outputs.timestamp }}"

  server-pull-images:
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        env:
          POSTGRES_DB: tejara
          POSTGRES_USER: deploy
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          SESSION_SECRET_KEY: ${{ secrets.SESSION_SECRET_KEY }}
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          DOMAIN_SYNC_WEBHOOK_SECRET: ${{ secrets.DOMAIN_SYNC_WEBHOOK_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        with:
          host: www.tejara.ps
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,RECAPTCHA_SITE_KEY,RECAPTCHA_SECRET_KEY,SESSION_SECRET_KEY,SMS_API_KEY,CLOUDFLARE_API_TOKEN,CLOUDFLARE_ZONE_ID,DOMAIN_SYNC_WEBHOOK_SECRET,ADMIN_PASSWORD,CRON_SECRET
          script: |
            cd tegara
            git pull
            
            # Create/Update .env.prod with secrets from GitHub Actions
            cat > .env.prod << EOF
            # PostgreSQL Database Credentials
            POSTGRES_DB=${POSTGRES_DB}
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            
            # reCAPTCHA Configuration
            RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY}
            RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
            
            # Session Secret
            SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
            
            # SMS Configuration
            SMS_API_KEY=${SMS_API_KEY}
            
            # Cloudflare Configuration
            CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
            CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID}
            
            # Webhook Secret
            DOMAIN_SYNC_WEBHOOK_SECRET=${DOMAIN_SYNC_WEBHOOK_SECRET}
            
            # Admin Dashboard
            ADMIN_PASSWORD=${ADMIN_PASSWORD}
            
            # Cron Secret
            CRON_SECRET=${CRON_SECRET}
            
            # Environment
            ENVIRONMENT=production
            DEBUG=false
            EOF
            
            # Deploy containers
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --force-recreate
            docker image prune -f

