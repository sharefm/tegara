name: CI/CD - DEV Environment

on:
  push:
    branches:
      - DEV
  pull_request:
    branches:
      - DEV

env:
  DOCKER_USERNAME: sharefdnskube
  DOCKER_REPO: sharefdnskube/tejara

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_SECRET }}
      
      - name: Generate timestamp
        id: timestamp
        run: echo "timestamp=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}:dev-latest
            ${{ env.DOCKER_REPO }}:${{ steps.timestamp.outputs.timestamp }}
          cache-from: type=registry,ref=${{ env.DOCKER_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_REPO }}:buildcache,mode=max
      
      - name: Image digest
        run: echo "Image pushed successfully with tags dev-latest and ${{ steps.timestamp.outputs.timestamp }}"
