version: '3.8'

services:
  web:
    image: tejaradev/tejara-dev:latest
    container_name: tegara-dev
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for live reloading in development
      - ./:/app
      # Persist database
      - ./data:/app/data
    env_file:
      - .env.dev
    environment:
      - ENVIRONMENT=development
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - tegara-network

  nginx:
    image: nginx:alpine
    container_name: nginx-dev
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf.dev:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - tegara-network

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer-dev
    ports:
      - "9443:9443"
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped
    networks:
      - tegara-network

networks:
  tegara-network:
    driver: bridge

volumes:
  data:
  portainer_data:
