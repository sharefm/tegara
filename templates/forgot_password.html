{% extends "base.html" %}

{% block title %}نسيت كلمة المرور - تجارة{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <div class="logo">
            <img src="/static/logo.jpg" alt="تجارة" style="max-width: 100px; margin-bottom: 10px;">
            <p>إعادة تعيين كلمة المرور</p>
        </div>

        {% if error %}
        <div class="alert alert-error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/forgot-password">
            <div class="form-group">
                <label for="mobile_number">رقم الهاتف</label>
                <input type="tel" id="mobile_number" name="mobile_number" placeholder="0599123456" required
                    pattern="[0-9]{10}" title="يجب أن يكون رقم الهاتف 10 أرقام">
            </div>

            <button type="submit" class="btn btn-primary">إرسال رمز التحقق</button>
        </form>

        <div class="link-text">
            تذكرت كلمة المرور؟ <a href="/login">تسجيل الدخول</a>
        </div>
    </div>
</div>
{% endblock %}
