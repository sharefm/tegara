{% extends "base.html" %}

{% block title %}التسجيل - تجارة{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <div class="logo">
            <h1>تجارة</h1>
            <p>سجل حسابك الآن</p>
        </div>

        {% if error %}
        <div class="alert alert-error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/register" id="registerForm">
            <div class="form-group">
                <label for="mobile_number">رقم الهاتف</label>
                <input type="tel" id="mobile_number" name="mobile_number" placeholder="0599123456" required
                    pattern="[0-9]{10}" title="يجب أن يكون رقم الهاتف 10 أرقام">
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" name="password" placeholder="كلمة المرور" required minlength="8"
                    title="يجب أن تكون كلمة المرور 8 أحرف على الأقل">
            </div>

            <div class="form-group">
                <label for="confirm_password">تأكيد كلمة المرور</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="تأكيد كلمة المرور"
                    required minlength="8">
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">إنشاء حساب</button>
        </form>

        <div class="link-text">
            لديك حساب بالفعل؟ <a href="/login">تسجيل الدخول</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Client-side validation
    document.getElementById('registerForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm_password').value;

        if (password !== confirmPassword) {
            alert('كلمات المرور غير متطابقة');
            return;
        }

        if (password.length < 8) {
            alert('كلمة المرور يجب أن تكون 8 أحرف على الأقل');
            return;
        }

        // reCAPTCHA v3 - get token and submit
        grecaptcha.ready(function () {
            grecaptcha.execute('{{ RECAPTCHA_SITE_KEY }}', { action: 'register' }).then(function (token) {
                // Add token to form
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'g-recaptcha-response';
                input.value = token;
                document.getElementById('registerForm').appendChild(input);

                // Submit form
                document.getElementById('registerForm').submit();
            });
        });
    });
</script>
{% endblock %}
