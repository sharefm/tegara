{% extends "base.html" %}

{% block title %}كلمة مرور جديدة - تجارة{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <div class="logo">
            <img src="/static/logo.jpg" alt="تجارة" style="max-width: 100px; margin-bottom: 10px;">
            <p>إنشاء كلمة مرور جديدة</p>
        </div>

        {% if error %}
        <div class="alert alert-error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/reset-password-new" id="resetPasswordForm">
            <div class="form-group">
                <label for="password">كلمة المرور الجديدة</label>
                <input type="password" id="password" name="password" placeholder="كلمة المرور" required minlength="8"
                    maxlength="60" pattern="[A-Za-z0-9!@#$%^&*()_+\-=\[\]{};':&quot;\\|,.<>/?]+"
                    title="يجب أن تكون كلمة المرور بين 8-60 حرف وتحتوي على أحرف إنجليزية وأرقام ورموز فقط">
                <small style="color: var(--text-muted); display: block; margin-top: 5px;">
                    8-60 حرف، أحرف إنجليزية وأرقام ورموز فقط
                </small>
            </div>

            <div class="form-group">
                <label for="confirm_password">تأكيد كلمة المرور</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="تأكيد كلمة المرور"
                    required minlength="8" maxlength="60">
            </div>

            <button type="submit" class="btn btn-primary">تغيير كلمة المرور</button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Client-side validation
    document.getElementById('resetPasswordForm').addEventListener('submit', function (e) {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm_password').value;

        // Validate password length
        if (password.length < 8) {
            e.preventDefault();
            alert('كلمة المرور يجب أن تكون 8 أحرف على الأقل');
            return;
        }

        if (password.length > 60) {
            e.preventDefault();
            alert('كلمة المرور يجب أن لا تتجاوز 60 حرف');
            return;
        }

        // Validate password contains only allowed characters
        const passwordPattern = /^[A-Za-z0-9!@#$%^&*()_+\-=\[\]{};':"\\|,.<>/?]+$/;
        if (!passwordPattern.test(password)) {
            e.preventDefault();
            alert('كلمة المرور يجب أن تحتوي على أحرف إنجليزية وأرقام ورموز فقط (لا يمكن استخدام أحرف عربية أو مسافات)');
            return;
        }

        // Validate passwords match
        if (password !== confirmPassword) {
            e.preventDefault();
            alert('كلمات المرور غير متطابقة');
            return;
        }
    });
</script>
{% endblock %}
