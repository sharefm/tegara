<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Tejara</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f1117;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .box {
            background: #1a1d27;
            border: 1px solid #2e3248;
            border-radius: 14px;
            padding: 2.5rem;
            width: 100%;
            max-width: 380px;
        }

        .brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #6366f1;
        }

        .brand p {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.35rem;
        }

        input {
            width: 100%;
            background: #222637;
            border: 1px solid #2e3248;
            border-radius: 8px;
            padding: 0.65rem 0.85rem;
            color: #e2e8f0;
            font-size: 0.9rem;
            font-family: inherit;
            transition: border-color 0.15s;
        }

        input:focus {
            outline: none;
            border-color: #6366f1;
        }

        .btn {
            width: 100%;
            margin-top: 1.25rem;
            padding: 0.7rem;
            background: #6366f1;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn:hover {
            background: #818cf8;
        }

        .alert {
            padding: 0.7rem 0.9rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .form-group {
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="brand">
            <h1>🛡️ Tejara Admin</h1>
            <p>Enter your admin password to continue</p>
        </div>
        {% if error %}
        <div class="alert">{{ error }}</div>
        {% endif %}
        <form method="post" action="/edara/login">
            <div class="form-group">
                <label for="password">Admin Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" autofocus required>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
    </div>
</body>

</html>
