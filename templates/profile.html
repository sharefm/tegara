{% extends "base.html" %}

{% block title %}الملف الشخصي - تجارة{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <div class="logo">
            <img src="/static/logo.jpg" alt="تجارة" style="max-width: 200px; margin-bottom: 10px;">
            <p>الملف الشخصي للمتجر</p>
        </div>

        {% if success %}
        <div class="alert alert-success">
            {{ success }}
        </div>
        {% endif %}

        <div class="profile-info">
            <div class="profile-info-item">
                <span class="profile-info-label">اسم المتجر:</span>
                <span class="profile-info-value">{{ store.store_name }}.tejara.ps</span>
            </div>
            <div class="profile-info-item">
                <span class="profile-info-label">اسم المالك:</span>
                <span class="profile-info-value">{{ store.owner_name }}</span>
            </div>
            <div class="profile-info-item">
                <span class="profile-info-label">رقم الهاتف:</span>
                <span class="profile-info-value">{{ store.mobile_number }}</span>
            </div>
        </div>

        <form method="POST" action="/profile">
            <div class="form-group">
                <label for="facebook_page">صفحة الفيسبوك</label>
                <input type="url" id="facebook_page" name="facebook_page" placeholder="https://facebook.com/mystore"
                    value="{{ store.facebook_page or '' }}">
            </div>

            <button type="submit" class="btn btn-primary">تحديث صفحة الفيسبوك</button>
        </form>

        <div style="margin-top: 20px;">
            <a href="/logout" style="text-decoration: none;">
                <button type="button" class="btn btn-secondary">تسجيل الخروج</button>
            </a>
        </div>
    </div>
</div>
{% endblock %}
