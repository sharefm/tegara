{% extends "base.html" %}

{% block title %}تسجيل الدخول - تجارة{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <div class="logo">
            <h1>تجارة</h1>
            <p>سجل دخولك الآن</p>
        </div>

        {% if error %}
        <div class="alert alert-error">
            {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="alert alert-success">
            {{ success }}
        </div>
        {% endif %}

        <form method="POST" action="/login" id="loginForm">
            <div class="form-group">
                <label for="mobile_number">رقم الهاتف</label>
                <input type="tel" id="mobile_number" name="mobile_number" placeholder="0599123456" required
                    pattern="[0-9]{10}" title="يجب أن يكون رقم الهاتف 10 أرقام">
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" name="password" placeholder="كلمة المرور" required>
                <div style="text-align: left; margin-top: 8px;">
                    <a href="/forgot-password"
                        style="color: var(--primary-color); text-decoration: none; font-size: 0.9rem;">نسيت كلمة
                        المرور؟</a>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">تسجيل الدخول</button>
        </form>

        <div class="link-text">
            ليس لديك حساب؟ <a href="/register">سجل الآن</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Client-side validation for login
    document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();

        // reCAPTCHA v3 - get token and submit
        grecaptcha.ready(function () {
            grecaptcha.execute('{{ RECAPTCHA_SITE_KEY }}', { action: 'login' }).then(function (token) {
                // Add token to form
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'g-recaptcha-response';
                input.value = token;
                document.getElementById('loginForm').appendChild(input);

                // Submit form
                document.getElementById('loginForm').submit();
            });
        });
    });

    // Auto-redirect after successful registration
    {% if success %}
    setTimeout(function () {
        const successAlert = document.querySelector('.alert-success');
        if (successAlert) {
            successAlert.style.opacity = '0.5';
        }
    }, 2000);
    {% endif %}
</script>
{% endblock %}
