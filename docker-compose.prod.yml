version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tegara-prod
    ports:
      - "8080:8000"
    volumes:
      # Only persist database, no source code mounting
      - ./data:/app/data
    env_file:
      - .env.prod
    environment:
      - ENVIRONMENT=production
    restart: always
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - tegara-network

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer-prod
    ports:
      - "9443:9443"
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: always
    networks:
      - tegara-network

networks:
  tegara-network:
    driver: bridge

volumes:
  data:
  portainer_data:
