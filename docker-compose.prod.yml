version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tegara-prod
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for live reloading
      - ./:/app
      # Persist database
      - ./data:/app/data
    env_file:
      - .env.prod
    environment:
      - ENVIRONMENT=production
    restart: always
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - tegara-network

  nginx:
    image: nginx:alpine
    container_name: nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf.prod:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    restart: always
    networks:
      - tegara-network

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer-prod
    ports:
      - "9443:9443"
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: always
    networks:
      - tegara-network

networks:
  tegara-network:
    driver: bridge

volumes:
  data:
  portainer_data:
