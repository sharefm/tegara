version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-prod
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: tejara
      POSTGRES_USER: deploy
      # POSTGRES_PASSWORD is loaded from env_file (.env.prod)
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    shm_size: 1gb
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U deploy || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    network_mode: host

  web:
    image: sharefdnskube/tejara:prod-latest
    container_name: web-prod
    volumes:
      # Persist database
      - ./data:/app/data
      - ./logging.conf:/app/logging.conf:ro
    env_file:
      - .env.prod
    environment:
      - ENVIRONMENT=production
      # DATABASE_URL is loaded from env_file (.env.prod) to avoid empty shell substitution
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --log-config /app/logging.conf --access-log --proxy-headers
    restart: always
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    network_mode: host

  nginx:
    image: nginx:alpine
    container_name: nginx-prod
    volumes:
      - ./nginx.conf.prod:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    restart: always
    network_mode: host

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: always
    network_mode: host

volumes:
  portainer_data:
